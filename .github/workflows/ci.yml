name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets `release.yml` run this exact gate before publishing, so the release path and
  # the everyday path can never drift apart.
  workflow_call:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # The main branch ruleset requires a status check named exactly `ci`.
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The steps below are `pnpm gates`, one step per gate so a failure names itself in
      # the job summary rather than in the middle of a single log.
      - name: Generate scratch Prisma client
        run: pnpm generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Duplication check
        run: pnpm duplicates

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check packed contents
        run: pnpm pack:check

  # The other Node majors `engines` claims, on the runtime-dependent gates only. The Node 26
  # lane is advisory until Prisma's engines list Node 26: it must never block a pull request
  # or a release.
  test-node:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node == 26 }}
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate scratch Prisma client
        run: pnpm generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Not part of `pnpm gates`, which stays Docker-free: the `*.postgres.test.ts` lane against
  # a Postgres container Testcontainers starts on the runner's Docker.
  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate scratch Prisma clients
        run: pnpm generate

      - name: Test on Postgres
        run: pnpm test:postgres

  # Not part of `pnpm gates`: fails when the generated factory file's instantiation
  # count exceeds `scripts/bench-types/budget.json`.
  bench-types:
    name: bench-types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-level compile cost
        run: pnpm bench:types
