name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets `release.yml` run this exact gate before publishing, so the release path and
  # the everyday path can never drift apart.
  workflow_call:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The steps below are `pnpm gates`, one step per gate so a failure names itself in
      # the job summary rather than in the middle of a single log.
      - name: Generate scratch Prisma client
        run: pnpm generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Duplication check
        run: pnpm duplicates

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check packed contents
        run: pnpm pack:check
