allowBuilds:
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  prisma: true
  # Optional native accelerators and a postinstall script pulled in by Testcontainers, which runs without them.
  cpu-features: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@prisma/adapter-better-sqlite3@7.10.1"
  - "@prisma/adapter-pg@7.10.1"
  - "@prisma/client-runtime-utils@7.10.1"
  - "@prisma/client@7.10.1"
  - "@prisma/config@7.10.1"
  - "@prisma/debug@7.10.1"
  - "@prisma/driver-adapter-utils@7.10.1"
  - "@prisma/engines@7.10.1"
  - "@prisma/fetch-engine@7.10.1"
  - "@prisma/get-platform@7.10.1"
  - prisma@7.10.1
